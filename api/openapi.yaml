openapi: 3.0.3
info:
  title: Financial Ledger API
  version: 1.0.0
  description: General ledger portfolio MVP. Exact string minor units; immutable,
    atomic postings; ledger-scoped HS256 access tokens. Server-assigned timestamps;
    no FX or backdating. See README and docs/operations.md for token issuance and
    role permissions.
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
  /healthz:
    get:
      summary: Process liveness
      operationId: get__healthz
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      security: []
  /readyz:
    get:
      summary: PostgreSQL connectivity
      operationId: get__readyz
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
      security: []
  /v1/currencies:
    get:
      summary: List currency metadata
      operationId: get__v1_currencies
