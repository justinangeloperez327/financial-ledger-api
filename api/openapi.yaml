components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 with verified sub, iss, aud, iat, exp and nbf. Maximum lifetime
        one hour. ledgers maps UUIDs to reader/writer/admin; admin=true is global
        operator.
  parameters:
    LedgerID:
      name: ledgerID
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
        pattern: ^[0-9a-f-]{36}$
    AccountID:
      name: accountID
      in: path
      required: true
      schema: *id001
    JournalID:
      name: journalID
      in: path
      required: true
      schema: *id001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Durable ledger-scoped key. Reuse only for the same typed payload
        and operation. Line ordering is significant.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unauthorized
              - forbidden
              - invalid_request
              - not_found
              - conflict
              - unavailable
              - internal_error
            request_id:
              type: string
          required:
          - code
          - request_id
      required:
      - error
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LedgerCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      additionalProperties: false
      required:
      - name
    Ledger:
      type: object
      properties:
        id: *id001
        name:
          type: string
        created_at: &id004
          type: string
          format: date-time
      required:
      - id
      - name
      - created_at
    AccountCreate:
      type: object
      properties:
        code: &id005
          type: string
          minLength: 1
          maxLength: 40
        name: &id006
          type: string
          minLength: 1
          maxLength: 120
        kind: &id007
          type: string
          enum:
          - asset
          - liability
          - equity
          - income
          - expense
        currency: &id002
          type: string
          enum:
          - AED
          - PHP
          - USD
        allow_negative:
          type: boolean
          default: true
      additionalProperties: false
      required:
      - code
      - name
      - kind
      - currency
    Line:
      type: object
      properties:
        account_id: *id001
        side:
          type: string
          enum:
          - debit
          - credit
        amount: &id003
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          description: Positive minor-unit integer, at most 9223372036854775807. AED
            100.00 is "10000".
          example: '10000'
      additionalProperties: false
      required:
      - account_id
      - side
      - amount
    Posting:
      type: object
      properties:
        currency: *id002
        description:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/Line'
          description: Unique account IDs; total debits equal total credits within
            int64 limits.
      additionalProperties: false
      required:
      - currency
      - description
      - lines
    Transfer:
      type: object
      properties:
        from_account_id: *id001
        to_account_id: *id001
        currency: *id002
        amount: *id003
        description:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
      required:
      - from_account_id
      - to_account_id
      - currency
      - amount
      - description
    Reversal:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
      required:
      - description
    Journal:
      type: object
      properties:
        id: *id001
        ledger_id: *id001
        currency: *id002
        description:
          type: string
        reversal_of:
          type: string
          format: uuid
          pattern: ^[0-9a-f-]{36}$
          nullable: true
        actor:
          type: string
        created_at: *id004
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          nullable: true
          description: Populated by detail and posting endpoints. Null in paginated
            journal header lists.
      required:
      - id
      - ledger_id
      - currency
      - description
      - reversal_of
      - actor
      - created_at
      - lines
    Balance:
      type: object
      properties:
        account_id: *id001
        code:
          type: string
        kind:
          type: string
          enum:
          - asset
          - liability
          - equity
          - income
          - expense
        currency: *id002
        debits:
          type: string
          pattern: ^[0-9]+$
        credits:
          type: string
          pattern: ^[0-9]+$
        balance:
          type: string
          pattern: ^-?[0-9]+$
          description: 'Natural balance: debit minus credit for assets/expenses; credit
            minus debit otherwise. Arbitrary precision minor units.'
      required:
      - account_id
      - code
      - kind
      - currency
      - debits
      - credits
      - balance
    StatementLine:
      type: object
      properties:
        journal_id: *id001
        description:
          type: string
        created_at: *id004
        side:
          type: string
          enum:
          - debit
          - credit
        amount: *id003
      required:
      - journal_id
      - description
      - created_at
      - side
      - amount
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor:
          type: string
        action:
          type: string
        resource_id: *id001
        created_at: *id004
      required:
      - id
      - actor
      - action
      - resource_id
      - created_at
    Currency:
      type: object
      properties:
        code: *id002
        minor_units:
          type: integer
          minimum: 0
          maximum: 4
      required:
      - code
      - minor_units
    Account:
      type: object
      properties:
        code: *id005
        name: *id006
        kind: *id007
        currency: *id002
        allow_negative:
          type: boolean
        id: *id001
        ledger_id: *id001
        closed:
          type: boolean
        created_at: *id004
      required:
      - code
      - name
      - kind
      - currency
      - allow_negative
      - id
      - ledger_id
      - closed
      - created_at
    AccountList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - data
      - limit
      - offset
    JournalList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Journal'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - data
      - limit
      - offset
    Statement:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatementLine'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - data
      - limit
      - offset
    AuditList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        limit:
          type: integer
        offset:
          type: integer
      required:
      - data
      - limit
      - offset
    TrialBalance:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Balance'
      required:
      - data
    CurrencyList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
      required:
      - data
