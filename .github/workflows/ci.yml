name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go modules
        run: go mod tidy
      - name: Emit resolved module manifests (bootstrap only)
        run: |
          echo BEGIN_RESOLVED_GO_MOD
          cat go.mod
          echo END_RESOLVED_GO_MOD
          echo BEGIN_RESOLVED_GO_SUM
          cat go.sum
          echo END_RESOLVED_GO_SUM
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Static analysis
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race ./...
      - name: Build API
        run: go build -o /tmp/financial-ledger-api ./cmd/api
